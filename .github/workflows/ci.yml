name: Build and consumer tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
        netty: ['4.2.17.Final', '4.2.18.Final']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify library and real Boot consumer
        run: ./mvnw -B -ntp -Dnetty.version=${{ matrix.netty }} -Pconsumer-test clean verify
  release-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build unsigned release artifacts without uploading
        run: ./mvnw -B -ntp -Prelease -Dgpg.skip=true verify
